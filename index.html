<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a160d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="देवरुखकर मंडळ">
<title>देवरुखकर बंधु उत्कर्ष मंडळ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#7a160d;overflow:hidden;font-family:"Noto Sans Devanagari",Arial,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f8}
#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#7a160d,#b5402a 60%,#d9822b);color:#fff;text-align:center;transition:opacity .4s;z-index:2}
#sp img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.12);margin:14px 0}
#sp b{font-size:23px}#sp small{opacity:.9;margin-top:6px}
#ib{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:none;background:#fffaf0;color:#2b2523;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px;border:2px solid #c79a32;animation:up .35s ease}
@keyframes up{from{transform:translateY(120%)}to{transform:none}}
#ib .r{display:flex;gap:12px;align-items:center}
#ib img{width:52px;height:52px;border-radius:50%;flex:none}
#ib b{display:block;font-size:16.5px;color:#7a160d}
#ib small{display:block;font-size:13px;color:#6f665c;line-height:1.4}
#ib .a{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#ib button,#ib a.btn{min-height:46px;border-radius:12px;border:0;font-weight:800;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none}
#ib .go{background:#7a160d;color:#fff}#ib .no{background:#efe6d6;color:#5b4a2c}
#ib ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div id="sp"><div style="letter-spacing:2px">॥ श्री ॥</div><img src="icon-512.png" alt=""><b>देवरुखकर बंधु उत्कर्ष मंडळ</b><small>एकत्र येऊ, उत्कर्ष साधू…</small></div>
<iframe id="app" allow="clipboard-write; web-share" title="देवरुखकर मंडळ ॲप"></iframe>
<div id="ib"></div>
<script>
/* ⬇️ फक्त ही एक ओळ बदला: ॲपची लिंक (Apps Script Web App ची /exec ने संपणारी लिंक) */
const APP_URL = "https://script.google.com/macros/s/AKfycbwZAm99an0WJHY7ffpflgaASWcnYcsaeR7CP3jiOguGA0xhSjVnUnpdBkkeRNY1iZAs/exec";

const f=document.getElementById('app'),sp=document.getElementById('sp'),ib=document.getElementById('ib');
function hideSp(){if(sp.parentNode){sp.style.opacity=0;setTimeout(()=>sp.remove(),450);}}
if(APP_URL.indexOf('script.google.com')<0){sp.innerHTML='<b>⚠️ index.html मध्ये APP_URL भरा</b>';}
else{f.src=APP_URL;f.addEventListener('load',()=>setTimeout(hideSp,700));setTimeout(hideSp,9000);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- 📲 Install popup (HTS सारखा) ---------- */
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ua=navigator.userAgent||'',isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua);
const isChrome=/Chrome\/\d/.test(ua)&&!/EdgA|Edg\/|SamsungBrowser|OPR|Firefox|FxiOS|; wv\)|FBAN|FBAV|Instagram/i.test(ua);
const snoozed=()=>{try{return Date.now()<Number(localStorage.getItem('ib_snooze')||0);}catch(e){return false;}};
const snooze=d=>{try{localStorage.setItem('ib_snooze',String(Date.now()+d*86400000));}catch(e){}};
let deferred=null,shown=false;
function head(t,s){return '<div class="r"><img src="icon-192.png" alt=""><div><b>'+t+'</b><small>'+s+'</small></div></div>';}
function show(html){if(standalone)return;ib.innerHTML=html;ib.style.display='block';shown=true;
  const no=ib.querySelector('.no');if(no)no.onclick=()=>{ib.style.display='none';snooze(3);};}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferred=e;if(standalone||snoozed())return;
  setTimeout(()=>{show(head('📲 देवरुखकर मंडळ ॲप Install करा','मोबाईलच्या ॲप-यादीत मंडळाचा आयकॉन येईल आणि ॲप पूर्ण स्क्रीनमध्ये, झटपट उघडेल.')+'<div class="a"><button class="no">नंतर</button><button class="go" id="ibGo">📲 Install</button></div>');
    document.getElementById('ibGo').onclick=async()=>{ib.style.display='none';try{deferred.prompt();const r=await deferred.userChoice;if(r&&r.outcome!=='accepted')snooze(1);}catch(x){}deferred=null;};},1500);
});
window.addEventListener('appinstalled',()=>{ib.style.display='none';snooze(3650);});
/* Chrome नसेल (WhatsApp / Edge / इतर) तर मार्गदर्शन */
setTimeout(()=>{
  if(standalone||shown||deferred||snoozed())return;
  if(isIOS){show(head('📲 मंडळ ॲप Home Screen वर','Safari मध्ये:')+'<ol><li>खालचे <b>Share ⬆️</b> बटण</li><li><b>Add to Home Screen</b></li></ol><div class="a"><button class="no">ठीक</button><span></span></div>');return;}
  if(isAndroid&&!isChrome){const here=location.href.replace(/^https?:\/\//,'');
    show(head('📲 Install साठी Chrome मध्ये उघडा','हे पान दुसऱ्या browser मध्ये उघडले आहे. Chrome मध्ये उघडल्यावर "Install" येईल.')+'<div class="a"><button class="no">नंतर</button><a class="btn go" href="intent://'+here+'#Intent;scheme=https;package=com.android.chrome;end">Chrome मध्ये उघडा</a></div>');return;}
  if(isAndroid&&isChrome){show(head('📲 मंडळ ॲप Install करा','Chrome मध्ये:')+'<ol><li>वर उजवीकडे <b>⋮</b></li><li><b>Install app</b> / <b>ॲप इंस्टॉल करा</b></li></ol><div class="a"><button class="no">नंतर</button><span></span></div>');}
},6000);
</script>
</body>
</html>
